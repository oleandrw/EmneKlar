[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emneklar"
# Must match ../VERSION (checked by tests/test_version.py; bump with scripts/bump_version.py).
version = "0.1.0"
description = "EmneKlar – lokal analyse, kvalitetssikring og forbedring av Canvas-emner."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    # GuardedNetworkBackend (SSRF protection) relies on httpcore internals that
    # are stable in this range. Raise the bound only together with test_ssrf.py.
    "httpx>=0.27,<0.29",
    "certifi>=2024.8",
    "keyring>=25",
    "beautifulsoup4>=4.12",
    "defusedxml>=0.7",
    "pypdf>=5.0",
    "nh3>=0.2.18",
    # Emne-RAG: vector search, image filtering, rendering scanned PDF pages for OCR, PDF export.
    "numpy>=1.26",
    "Pillow>=10.4",
    "pypdfium2>=4.30",
    "fpdf2>=2.8",
]

[project.optional-dependencies]
# Emne-RAG with local models (several GB with PyTorch). Installed by setup-emne-rag.bat / setup.bat --rag;
# update.bat keeps it installed. EmneKlar works without it (keyword search, captions, provider embeddings).
rag = [
    "sentence-transformers>=5.0",
    "faster-whisper>=1.1",
    "youtube-transcript-api>=1.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["emneklar*"]

[tool.setuptools.package-data]
emneklar = ["**/*.json", "**/*.md", "**/*.html", "**/*.css"]

[tool.ruff]
line-length = 125
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "C4", "S", "RUF"]
ignore = [
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "S101",   # asserts are fine for type narrowing
    "RUF001", # Norwegian text contains characters ruff considers ambiguous
    "RUF002",
    "RUF003",
    "S603",   # subprocess without shell=True is intended; arguments are fixed
    "S105",   # constant names like SESSION_COOKIE are not passwords
    "RUF012", # class-level constant tables are intentional
    "SIM905", # word lists written as "a b c".split() are easier to read
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501", "RUF012", "BLE001"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 120
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "invariant: tests for the safety invariants in CLAUDE.md (writes, secrets, dry run)",
    "slow: spawns worker processes",
]

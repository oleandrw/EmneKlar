# Alembic CLI configuration for developers. The application itself configures
# Alembic in code (emneklar/core/storage/db.py) and migrates at start-up.
#
#   cd backend
#   .venv\Scripts\alembic revision --autogenerate -m "describe change"
#
# The URL below points at a throw-away development database. Never commit a
# real database.
[alembic]
script_location = migrations
sqlalchemy.url = sqlite:///./dev-migrations.db
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

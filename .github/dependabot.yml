# Monthly dependency updates as pull requests (reviewed and tested by CI before merge).
# Updates are grouped per ecosystem so each month gives at most one PR per ecosystem instead of one per
# package; every PR runs CI, so fewer PRs means far fewer Actions minutes. Security updates still arrive
# as soon as they are published.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      backend:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      frontend:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

name: CI

# Actions minutes: pull requests get a fast Linux-only check; the full Windows matrix, E2E, the Windows package
# (runtime, installer, update) and the Windows install from source run on main and on demand
# (Actions → CI → Run workflow on any branch). Windows runners count double, so they are kept off the per-commit path.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Node.js LTS. frontend/package-lock.json needs >= 22.22.2 (react-router, jsdom); "22" resolves to the newest 22.x.
  NODE_VERSION: "22"
  # The Python version of the runtime that is bundled with the Windows package (packaging/runtime.json).
  RUNTIME_PYTHON: "3.14"

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Pull requests: Ubuntu + Python 3.13 only. main / manual runs: Windows and Ubuntu, 3.12 to 3.14 (3.14 is the
      # version bundled with the Windows package), plus Ubuntu 3.11 (oldest supported, requires-python >= 3.11).
      matrix: ${{ fromJSON(github.event_name == 'pull_request'
        && '{"os":["ubuntu-latest"],"python":["3.13"]}'
        || '{"os":["windows-latest","ubuntu-latest"],"python":["3.12","3.13","3.14"],"include":[{"os":"ubuntu-latest","python":"3.11"}]}') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            backend/constraints.txt
            backend/pyproject.toml
      # Every pin in backend/constraints.txt has wheels for CPython 3.11-3.14 on Windows and Linux,
      # so the tested versions are used on every matrix entry.
      - name: Install backend with dev tools (pinned versions)
        run: python -m pip install -c backend/constraints.txt -e "backend[dev]"
      - name: Ruff
        working-directory: backend
        run: python -m ruff check --config pyproject.toml . ../scripts
      - name: Mypy
        working-directory: backend
        run: python -m mypy emneklar ../scripts
      - name: Pytest (includes the migrations-vs-models check)
        working-directory: backend
        run: python -m pytest

  frontend:
    name: Frontend (typecheck, lint, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: End-to-end (Playwright + axe)
    # Windows, like the users and the developers: the Playwright setup starts
    # backend/tests/fakes/dev_server.py with the Python from backend\.venv.
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - name: Python environment in backend\.venv (as setup.bat creates it)
        shell: pwsh
        run: |
          python -m venv backend\.venv
          backend\.venv\Scripts\python.exe -m pip install -c backend\constraints.txt -e backend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Make "python" resolve to the venv as well, whichever way the Playwright config starts it.
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $PWD 'backend\.venv\Scripts')
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build the user interface (served by the backend)
        working-directory: frontend
        run: npm run build
      - name: Playwright + axe
        working-directory: frontend
        run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit (pip-audit, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Resolve the runtime dependencies (pinned, without dev tools)
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install -c backend/constraints.txt -e backend
          "$RUNNER_TEMP/runtime/bin/python" -m pip freeze --exclude-editable > "$RUNNER_TEMP/runtime-requirements.txt"
          cat "$RUNNER_TEMP/runtime-requirements.txt"
      - name: pip-audit (runtime dependencies)
        run: |
          python -m pip install -c backend/constraints.txt pip-audit
          python -m pip_audit --requirement "$RUNNER_TEMP/runtime-requirements.txt" --no-deps --disable-pip \
            --progress-spinner off
      # Exactly the files that are installed in the runtime bundled with the Windows package.
      - name: pip-audit (the locked packages of the bundled Windows runtime)
        run: >
          python -m pip_audit --requirement packaging/runtime-win-amd64.txt --no-deps --disable-pip
          --progress-spinner off
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: npm audit (runtime dependencies)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev

  windows-package:
    name: Windows package (runtime, installer, install, update, uninstall)
    # What a teacher gets: the installer with its own Python runtime. Built exactly as the release workflow builds
    # it, then installed, started, stopped, reinstalled, updated (also with a version that cannot start) and removed.
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the user interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.RUNTIME_PYTHON }}
      - name: Build the bundled runtime (hash-checked)
        run: python scripts/build_runtime.py build
      - name: Package
        run: |
          runtime="$(ls dist-release/EmneKlar-runtime-win-amd64-*.zip)"
          version="$(tr -d '[:space:]' < VERSION)"
          echo "RUNTIME=$runtime" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          python scripts/package_release.py --repository "$GITHUB_REPOSITORY" --runtime "$runtime"
      - name: Inno Setup (preinstalled on the runner image; installed if it is missing)
        shell: pwsh
        run: |
          $found = (Get-Command iscc -ErrorAction SilentlyContinue) -or
            (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")
          if (-not $found) { choco install innosetup --no-progress -y; if ($LASTEXITCODE -ne 0) { exit 1 } }
      - name: Build the installer (not signed)
        run: python scripts/build_installer.py --package "dist-release/EmneKlar-$VERSION.zip" --runtime "$RUNTIME"
      - name: Install, start, stop, reinstall and uninstall
        run: >
          python scripts/verify_windows_installer.py --installer "dist-release/EmneKlar-$VERSION-setup.exe"
          --work "$RUNNER_TEMP/emneklar-installer"
      - name: Update an installed copy (with a new runtime)
        run: >
          python scripts/local_update_test.py --package "dist-release/EmneKlar-$VERSION.zip" --runtime "$RUNTIME"
          --work "$RUNNER_TEMP/emneklar-update"
      - name: Roll back a new version that cannot start
        run: >
          python scripts/local_update_test.py --package "dist-release/EmneKlar-$VERSION.zip" --runtime "$RUNTIME"
          --work "$RUNNER_TEMP/emneklar-rollback" --break-new-version
      # Only an installer that passed every check above is kept: for trying it on another PC. It is the normal build
      # (not the test build), not code-signed and not a release – nothing can update to it.
      - name: Keep the installer for 14 days (not signed, not a release)
        uses: actions/upload-artifact@v7
        with:
          path: dist-release/EmneKlar-${{ env.VERSION }}-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14
      - name: Show the installer's checksum
        run: |
          {
            echo "### EmneKlar-$VERSION-setup.exe"
            echo
            echo "Download it under *Artifacts* below; it is deleted after 14 days. Not code-signed (SmartScreen will"
            echo "warn) and not a release. It is the normal build: on another PC it uses %LOCALAPPDATA%\\EmneKlar,"
            echo "port 8770 and the credential service \"EmneKlar\", like a teacher's installation."
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "dist-release/EmneKlar-$VERSION-setup.exe.sha256")\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-package-logs
          path: ${{ runner.temp }}/emneklar-*/**/*.log
          if-no-files-found: ignore

  windows-install:
    name: Windows install from source (setup.bat with your own Python, start, health, stop)
    # The fallback way to install: the zip package or a clone, with a Python that is already on the machine.
    runs-on: windows-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 30
    env:
      EMNEKLAR_STRICT_PINS: "1" # CI must use the tested versions, never the fallback
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Use a throw-away data folder
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "EMNEKLAR_DATA_DIR=$(Join-Path $env:RUNNER_TEMP 'emneklar-data')"
      # ".\" also works where NoDefaultCurrentDirectoryInExePath is set (cmd.exe then ignores the current folder).
      - name: setup.bat (non-interactive)
        shell: cmd
        env:
          EMNEKLAR_PYTHON: ${{ steps.python.outputs.python-path }}
        run: call .\setup.bat --no-pause
      - name: setup.bat again (idempotent)
        shell: cmd
        env:
          EMNEKLAR_PYTHON: ${{ steps.python.outputs.python-path }}
        run: call .\setup.bat --no-pause
      - name: Start EmneKlar with start.bat, check /api/health, stop it
        shell: pwsh
        run: |
          $py = Join-Path $PWD 'backend\.venv\Scripts\python.exe'
          $console = Join-Path $env:RUNNER_TEMP 'emneklar-console.txt'  # has the login link: never printed
          $app = Start-Process -FilePath cmd.exe -ArgumentList '/d', '/c', '.\start.bat', '--no-browser' `
            -WorkingDirectory $PWD -RedirectStandardOutput $console -RedirectStandardError "$console.err" `
            -NoNewWindow -PassThru
          $null = $app.Handle  # keeps ExitCode available after the process has exited
          & $py -m emneklar.manage health --wait 120
          if ($LASTEXITCODE -ne 0) {
            Get-Content "$console.err" -ErrorAction SilentlyContinue
            Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          & $py -m emneklar.manage stop --timeout 60
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not $app.WaitForExit(60000)) { Write-Error 'start.bat did not exit after the stop request'; exit 1 }
          if ($app.ExitCode -ne 0) { Write-Error "start.bat exited with code $($app.ExitCode)"; exit 1 }
          & $py -m emneklar.manage health
          if ($LASTEXITCODE -eq 0) { Write-Error 'EmneKlar still answers after stop'; exit 1 }
          exit 0
      - name: Upload the setup and app logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-install-logs
          path: ${{ runner.temp }}/emneklar-data/logs/
          if-no-files-found: ignore

  platform-smoke:
    name: Starts on ${{ matrix.os }} (smoke test – not a supported platform)
    # macOS and Linux have no package, no installer and no updater (docs/PLATFORMS.md). This only answers one
    # question: does the program start from source and answer on that system? A failure here never blocks a merge or
    # a release, and a green run is not a promise of support.
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'pull_request'
    continue-on-error: true
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest: Linux x86_64. macos-latest: Apple silicon (arm64). macos-15-intel: Intel (x86_64).
        os: [ubuntu-latest, macos-latest, macos-15-intel]
    env:
      EMNEKLAR_SECRET_BACKEND: memory # no Secret Service / Keychain prompt on a build machine
      EMNEKLAR_NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.RUNTIME_PYTHON }}
      - name: Install from source (pinned versions)
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -c backend/constraints.txt -e backend
      - name: Start, check /api/health, stop
        run: |
          export EMNEKLAR_DATA_DIR="$RUNNER_TEMP/emneklar-data"
          cd backend
          .venv/bin/python -m emneklar > "$RUNNER_TEMP/emneklar-console.txt" 2>&1 &
          .venv/bin/python -m emneklar.manage health --wait 120
          .venv/bin/python -m emneklar.manage stop --timeout 60
          if .venv/bin/python -m emneklar.manage health; then echo "still answers after stop"; exit 1; fi

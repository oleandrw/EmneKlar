name: Release

# Push a tag vX.Y.Z (matching VERSION, see scripts/bump_version.py) to publish EmneKlar-X.Y.Z.zip and its
# .sha256 as a GitHub release. update.bat downloads exactly these two files.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release and upload its assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: The tag must match VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version); expected v$version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the user interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Package (zip + sha256 + release notes from CHANGELOG.md)
        run: >
          python scripts/package_release.py --repository "$GITHUB_REPOSITORY"
          --notes-out dist-release/RELEASE_NOTES.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            "dist-release/EmneKlar-$VERSION.zip" \
            "dist-release/EmneKlar-$VERSION.zip.sha256" \
            --title "EmneKlar $VERSION" \
            --notes-file dist-release/RELEASE_NOTES.md \
            --verify-tag $prerelease
